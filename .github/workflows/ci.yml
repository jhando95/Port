name: CI

on:
  push:
  pull_request:

jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install gcport
        run: pip install -e "tools/[dev]"
      - name: Run tests
        run: pytest tools/tests -q

  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Configure
        run: cmake -S runtime -B runtime/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build runtime/build
      - name: Test
        run: ctest --test-dir runtime/build --output-on-failure
