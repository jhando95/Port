[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gcport"
version = "0.1.0"
description = "GameCube format tooling for the Port project: GCM/ISO, DOL, Yaz0"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
gcport = "gcport.cli:main"

[tool.setuptools.packages.find]
include = ["gcport*"]
